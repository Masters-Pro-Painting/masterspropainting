# Master's Pro Painting Inc website. Netlify reads everything from this file.
# Every push to `main` builds and publishes the live site.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # "true"  = whole site noindex + robots.txt blocks crawlers (use until the domain points here)
  # "false" = live and indexable
  PUBLIC_STAGING = "true"
  # ---- TRACKING: paste IDs between the quotes. Nothing else to install. ----
  # Public values (they appear in every page's source). Empty = that tracking is off.
  # Don't paste Google's <script> code anywhere. The site already has it built in.
  # A value the site can't read fails the build, and the last good version stays live.
  #
  # GA4 > Admin > Data streams > your stream > Measurement ID. Looks like G-ABC123XYZ9
  PUBLIC_GA4_ID = "G-R13VQRGHV2"
  # Google Ads > Goals > Summary > Website Form Lead > Tag setup > Use Google Tag Manager.
  # Conversion ID, with or without "AW-". Example: AW-123456789 or 123456789
  PUBLIC_ADS_ID = "AW-18429319741"
  # Same screen: Conversion label. The label alone, or the whole "AW-123456789/AbC..." works.
  PUBLIC_ADS_FORM_LABEL = "9W9GCP6e84MdEL205NNE"
  # Google Ads > Goals > Summary > Website Calls 60s+ > Tag setup > Conversion label.
  PUBLIC_ADS_CALL_LABEL = "7ejNCIGf84MdEL205NNE"

# Build files have unique names, so browsers can keep them for a year.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
