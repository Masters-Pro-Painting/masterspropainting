# Master's Pro Painting Inc website. Netlify reads everything from this file.
# Every push to `main` builds and publishes the live site.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # "true"  = whole site noindex + robots.txt blocks crawlers (use until the domain points here)
  # "false" = live and indexable
  PUBLIC_STAGING = "true"
  # Tracking IDs. These are public values (they appear in every page's source).
  # Empty = that piece of tracking is switched off.
  PUBLIC_GA4_ID = ""
  PUBLIC_ADS_ID = ""
  PUBLIC_ADS_FORM_LABEL = ""
  PUBLIC_ADS_CALL_LABEL = ""

# Build files have unique names, so browsers can keep them for a year.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
